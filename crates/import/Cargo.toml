[package]
name = "wuling-import"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
wuling-storage = { path = "../storage" }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
